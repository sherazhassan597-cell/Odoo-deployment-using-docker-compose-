services:
  web:
    image: odoo:17.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
        ADMIN_PASSWD: admin
        DB_HOST: db
        DB_USER: odoo
        DB_PASSWORD: odoo 
  db:
    image: postgres:15
    environment:
        POSTGRES_DB: postgres
        POSTGRES_PASSWORD: odoo
        POSTGRES_USER: odoo
